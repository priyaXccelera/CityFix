server:
  port: 27357

spring:
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /docs
    urls:
        - name: admin-announcement-service
          url: /admin-announcement-service/api-docs
        - name: issue-service
          url: /issue-service/api-docs
        - name: user-service
          url: /user-service/api-docs
